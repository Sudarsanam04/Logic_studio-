<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Digital Logic Studio</title>
<style>
:root{--bg:#0a1224;--card:#111c36;--tx:#e6edf8;--mu:#8fa3c4;--ac:#22d3ee;--ac2:#818cf8;--ok:#34d399;--bad:#f87171;--bd:#223559;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f6fb;--card:#fff;--tx:#0f1a33;--mu:#51618a;--ac:#0284c7;--ac2:#4f46e5;--ok:#059669;--bad:#dc2626;--bd:#d3dcec;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:22px 22px}
main{max-width:900px;margin:auto;padding:14px}h1{margin:0;font-size:20px;letter-spacing:.5px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}button{cursor:pointer}
button.on{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:700;box-shadow:0 0 10px var(--ac)}
.tabs button{flex:1 1 auto;white-space:nowrap}.tabs button.act{border-color:var(--ac2);color:var(--ac2);font-weight:700}
.sw{min-width:48px;text-align:center}.sw b{display:block;font-size:11px;font-weight:400;opacity:.8}
.led{display:inline-block;width:46px;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:4px}.led i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 3px;background:var(--bd)}.led.h i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.led span{font-size:11px;color:var(--mu)}
.scroll{overflow-x:auto}table{border-collapse:collapse;font:13px ui-monospace,monospace;width:100%}td,th{border:1px solid var(--bd);padding:3px 7px;text-align:center}tr.a td{background:color-mix(in srgb,var(--ac) 25%,transparent)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow:auto;font:12px/1.45 ui-monospace,monospace;max-height:300px;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.lec h3{margin:16px 0 4px;font-size:16px;color:var(--ac)}.lec p{margin:6px 0}.lec ul,.lec ol{padding-left:20px;margin:6px 0}.lec li{margin:4px 0}
.note{border-left:3px solid var(--ac2);background:color-mix(in srgb,var(--ac2) 12%,transparent);padding:8px 10px;border-radius:0 8px 8px 0;margin:10px 0}
.ov{text-decoration:overline}details{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:6px 0}summary{cursor:pointer}details p{margin:6px 0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap}.chips .act{border-color:var(--ac2);color:var(--ac2);font-weight:700}
code{font:12px ui-monospace,monospace}
</style></head><body><main>
<div class="row sp"><div><h1>⚡ DIGITAL LOGIC STUDIO</h1><small>DESIGN. SIMULATE. VERIFY. LEARN.</small></div><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='light'?'dark':'light'">◐ Theme</button></div>
<div class="card row tabs" id="tabs"></div><div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s),AN='ABCDEFGH'.split('');
const bits=(v,n)=>Array.from({length:n},(_,i)=>(v>>(n-1-i))&1),num=a=>a.reduce((x,b)=>x*2+b,0);
const nm=(p,w)=>Array.from({length:w},(_,i)=>p+(w-1-i)),bus=a=>'{'+a.join(', ')+'}',rng=n=>Array.from({length:n},(_,i)=>i);
const REG=[],add=(id,label,grp,wr,mk)=>REG.push({id,label,grp,wr,mk});
const gate={AND:[(a,b)=>a&b,' & ',0],NAND:[(a,b)=>a&b,' & ',1],OR:[(a,b)=>a|b,' | ',0],NOR:[(a,b)=>a|b,' | ',1],XOR:[(a,b)=>a^b,' ^ ',0],XNOR:[(a,b)=>a^b,' ^ ',1]};
for(const k in gate){const[op,sy,ng]=gate[k];add(k,k,'Logic gates',[2,8,2,'Inputs'],w=>{const ins=AN.slice(0,w),e=ins.join(sy),x=ng?'~('+e+')':e;return{ins,outs:['Y'],f:a=>{const r=a.reduce(op);return[ng?1-r:r]},v:['assign Y = '+x+';'],eq:'Y = '+x}})}
add('NOT','NOT','Logic gates',null,()=>({ins:['A'],outs:['Y'],f:a=>[1-a[0]],v:['assign Y = ~A;'],eq:'Y = ~A'}));
add('HA','Half adder','Arithmetic',null,()=>({ins:['A','B'],outs:['S','Cout'],f:([a,b])=>[a^b,a&b],v:['assign S = A ^ B;','assign Cout = A & B;'],eq:'S = A ^ B;  Cout = A & B'}));
add('FA','Full adder','Arithmetic',null,()=>({ins:['A','B','Cin'],outs:['S','Cout'],f:([a,b,c])=>[a^b^c,(a&b)|(c&(a^b))],v:['assign S = A ^ B ^ Cin;','assign Cout = (A & B) | (Cin & (A ^ B));'],eq:'S = A ^ B ^ Cin;  Cout = AB + Cin(A ^ B)'}));
add('HS','Half subtractor','Arithmetic',null,()=>({ins:['A','B'],outs:['D','Bout'],f:([a,b])=>[a^b,(1-a)&b],v:['assign D = A ^ B;','assign Bout = ~A & B;'],eq:'D = A ^ B;  Bout = A’B'}));
add('FS','Full subtractor','Arithmetic',null,()=>({ins:['A','B','Bin'],outs:['D','Bout'],f:([a,b,c])=>[a^b^c,((1-a)&b)|((1-(a^b))&c)],v:['assign D = A ^ B ^ Bin;','assign Bout = (~A & B) | (~(A ^ B) & Bin);'],eq:'D = A ^ B ^ Bin;  Bout = A’B + (A ⊙ B)Bin'}));
add('RCA','Ripple-carry adder','Arithmetic',[2,8,4,'Bits'],w=>{const A=nm('A',w),B=nm('B',w),S=nm('S',w),v=['wire ['+w+':0] c;','assign c[0] = Cin;'];for(let i=0;i<w;i++)v.push(`assign S${i} = A${i} ^ B${i} ^ c[${i}];`,`assign c[${i+1}] = (A${i} & B${i}) | (c[${i}] & (A${i} ^ B${i}));`);v.push('assign Cout = c['+w+'];');return{ins:[...A,...B,'Cin'],outs:['Cout',...S],f:a=>bits(num(a.slice(0,w))+num(a.slice(w,2*w))+a[2*w],w+1),v,eq:'{Cout,S} = A + B + Cin (unsigned). Cout=1 means overflow.'}});
add('MUX','Multiplexer (2^s:1)','MUX / DEMUX',[1,4,2,'Select lines'],s=>{const N=2**s,D=rng(N).map(i=>'D'+i),Sn=nm('S',s);return{ins:[...D,...Sn],outs:['Y'],f:a=>[a[num(a.slice(N))]],v:[`wire [${N-1}:0] d = ${bus(D.slice().reverse())};`,`wire [${s-1}:0] sel = ${bus(Sn)};`,'assign Y = d[sel];'],eq:`Y = D[S], ${N}:1`}});
add('DEMUX','Demultiplexer (1:2^s)','MUX / DEMUX',[1,4,2,'Select lines'],s=>{const N=2**s,Y=rng(N).map(i=>'Y'+i),Sn=nm('S',s);return{ins:['D',...Sn],outs:Y,f:a=>{const k=num(a.slice(1));return rng(N).map(i=>i==k?a[0]:0)},v:[`wire [${s-1}:0] sel = ${bus(Sn)};`,...rng(N).map(i=>`assign Y${i} = D & (sel == ${s}'d${i});`)],eq:`Y[S] = D, others 0 (1:${N})`}});
add('DEC','Decoder (n-to-2^n)','Encoders / decoders',[2,4,3,'Address bits'],n=>{const N=2**n,A=nm('A',n);return{ins:[...A,'EN'],outs:rng(N).map(i=>'Y'+i),f:a=>{const k=num(a.slice(0,n));return rng(N).map(i=>a[n]&&i==k?1:0)},v:[`wire [${n-1}:0] sel = ${bus(A)};`,...rng(N).map(i=>`assign Y${i} = EN & (sel == ${n}'d${i});`)],eq:`Yk = EN · (A == k), ${n}-to-${N}`}});
add('PENC','Priority encoder (2^n-to-n)','Encoders / decoders',[2,4,3,'Output bits'],n=>{const N=2**n,I=nm('I',N),Y=nm('Y',n);return{ins:I,outs:[...Y,'V'],f:a=>{const p=a.indexOf(1);return p<0?[...bits(0,n),0]:[...bits(N-1-p,n),1]},v:[`wire [${N-1}:0] I = ${bus(I)};`,`reg [${n-1}:0] yc; reg vv; integer i;`,'always @* begin yc = 0; vv = 0;',`  for (i = 0; i < ${N}; i = i + 1) if (I[i]) begin yc = i; vv = 1; end`,'end',...rng(n).map(i=>`assign Y${i} = yc[${i}];`),'assign V = vv;'],eq:'Y = index of highest-priority set input; V = valid (any input set)'}});
add('CMP','Magnitude comparator','Combinational',[2,8,4,'Bits'],w=>{const A=nm('A',w),B=nm('B',w);return{ins:[...A,...B],outs:['GT','EQ','LT'],f:a=>{const x=num(a.slice(0,w)),y=num(a.slice(w));return[+(x>y),+(x==y),+(x<y)]},v:[`wire [${w-1}:0] a = ${bus(A)};`,`wire [${w-1}:0] b = ${bus(B)};`,'assign GT = (a > b);','assign EQ = (a == b);','assign LT = (a < b);'],eq:'GT: A>B, EQ: A==B, LT: A<B'}});
add('B2G','Binary to Gray','Combinational',[2,8,4,'Bits'],w=>{const B=nm('B',w),G=nm('G',w);return{ins:B,outs:G,f:a=>a.map((x,i)=>i?x^a[i-1]:x),v:[`assign G${w-1} = B${w-1};`,...rng(w-1).map(k=>`assign G${k} = B${k+1} ^ B${k};`)],eq:'G(n-1) = B(n-1);  Gk = B(k+1) ^ Bk'}});
add('G2B','Gray to Binary','Combinational',[2,8,4,'Bits'],w=>{const G=nm('G',w),B=nm('B',w);return{ins:G,outs:B,f:a=>{let p=0;return a.map(x=>p^=x)},v:[`assign B${w-1} = G${w-1};`,...rng(w-1).map(k=>`assign B${k} = B${k+1} ^ G${k};`)],eq:'B(n-1) = G(n-1);  Bk = B(k+1) ^ Gk'}});
add('PAR','Even parity generator','Combinational',[2,8,4,'Data bits'],w=>{const D=nm('D',w);return{ins:D,outs:['P'],f:a=>[a.reduce((x,y)=>x^y)],v:['assign P = ^'+bus(D)+';'],eq:'P = D(n-1) ^ … ^ D0 (total ones including P is even)'}});
const getD=id=>REG.find(r=>r.id==id);
function verilog(c,mod){return `module ${mod}(\n  ${[...c.ins.map(x=>'input '+x),...c.outs.map(x=>'output '+x)].join(',\n  ')}\n);\n${c.v.map(l=>'  '+l).join('\n')}\nendmodule`}
function tb(c,mod){const n=c.ins.length,no=c.outs.length;let s=`\`timescale 1ns/1ps\nmodule tb_${mod};\n  reg ${c.ins.join(', ')};\n  wire ${c.outs.join(', ')};\n  integer err = 0${n>8?', i':''};\n  ${mod} dut(${[...c.ins,...c.outs].map(x=>'.'+x+'('+x+')').join(', ')});\n  initial begin\n`;
if(n<=8){for(let i=0;i<2**n;i++){const a=bits(i,n),o=c.f(a);s+=`    ${bus(c.ins)} = ${n}'b${a.join('')}; #1; if (${bus(c.outs)} !== ${no}'b${o.join('')}) begin err = err + 1; $display("FAIL in=%b", ${bus(c.ins)}); end\n`}}
else s+=`    // ${2**n} vectors: exhaustive loop, expected values must come from your own reference model\n    for (i = 0; i < ${2**n}; i = i + 1) begin ${bus(c.ins)} = i; #1; end\n`;
return s+`    $display("DONE errors=%0d", err); $finish;\n  end\nendmodule`}
/* ---------- combinational UI ---------- */
let S={tab:'comb',id:'AND',w:2,sw:[],page:0,mod:'and_gate'};
const cur=()=>{const d=getD(S.id);return{d,c:d.mk(S.w)}};
const reset=()=>{S.sw=cur().c.ins.map(()=>0);S.page=0};reset();
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}$('#msg')&&($('#msg').textContent='Copied ✓')}
function csv(c){const n=c.ins.length;return[[...c.ins,...c.outs].join(',')].concat(rng(2**n).map(i=>{const a=bits(i,n);return[...a,...c.f(a)].join(',')})).join('\n')}
function tabs(){$('#tabs').innerHTML=[['comb','Combinational'],['seq','Sequential'],['design','Circuit designer'],['learn','Learning center'],['test','Self-test']].map(([k,l])=>`<button class="${S.tab==k?'act':''}" onclick="S.tab='${k}';main()">${l}</button>`).join('')}
function main(){tabs();({comb:renderComb,seq:renderSeq,design:renderDesign,learn:renderLearn,test:renderTest})[S.tab]()}
function renderComb(){const{d,c}=cur(),groups=[...new Set(REG.map(r=>r.grp))];
$('#view').innerHTML=`<div class="card"><div class="row"><select onchange="S.id=this.value;S.w=getD(S.id).wr?getD(S.id).wr[2]:0;S.mod=S.id.toLowerCase()+'_'+(S.w||'');reset();main()">${groups.map(g=>`<optgroup label="${g}">${REG.filter(r=>r.grp==g).map(r=>`<option value="${r.id}" ${r.id==S.id?'selected':''}>${r.label}</option>`).join('')}</optgroup>`).join('')}</select>
${d.wr?`<label>${d.wr[3]} <select onchange="S.w=+this.value;S.mod=S.id.toLowerCase()+'_'+S.w;reset();main()">${rng(d.wr[1]-d.wr[0]+1).map(i=>i+d.wr[0]).map(v=>`<option ${v==S.w?'selected':''}>${v}</option>`).join('')}</select></label>`:''}</div>
<p class="mu">Independent input bits n = <b>${c.ins.length}</b> → total combinations 2<sup>${c.ins.length}</sup> = <b>${2**c.ins.length}</b></p><code>${c.eq}</code></div>
<div class="card"><b>Inputs</b> <small>(first input = MSB of the row index)</small><div class="row" id="sw" style="margin:8px 0"></div><div class="row"><button onclick="S.sw=S.sw.map(()=>0);S.page=pg();io();tbl()">Reset</button><button onclick="S.sw=S.sw.map(()=>Math.random()<.5?1:0);S.page=pg();io();tbl()">Random</button></div>
<hr style="border-color:var(--bd)"><b>Outputs</b><div class="row" id="out" style="margin:8px 0"></div><div id="dec" class="mu"></div></div>
<div class="card"><div class="row sp"><b>Truth table</b><span id="tinfo" class="mu"></span></div><div class="row" id="pager" style="margin:8px 0"></div><div class="scroll" id="tt"></div><div class="row" style="margin-top:8px"><button onclick="exportCsv()">Copy CSV</button><span id="msg" class="mu"></span></div></div>
<div class="card"><div class="row sp"><b>Verilog HDL</b><label>Module <input id="mod" value="${S.mod}" oninput="S.mod=this.value.replace(/\\W/g,'_')||'top';code()" size="16"></label></div><pre id="v"></pre><button onclick="cp(verilog(cur().c,S.mod))">Copy module</button><b style="display:block;margin-top:10px">Testbench</b><small>Expected values come from the JS reference model. Neither file has been compiled or run in an HDL simulator.</small><pre id="t"></pre><button onclick="cp(tb(cur().c,S.mod))">Copy testbench</button></div>`;io();tbl();code()}
const pg=()=>Math.floor(num(S.sw)/16);
function io(){const{c}=cur(),o=c.f(S.sw);$('#sw').innerHTML=c.ins.map((n,i)=>`<button class="sw ${S.sw[i]?'on':''}" onclick="S.sw[${i}]^=1;S.page=pg();io();tbl()"><b>${n}</b>${S.sw[i]}</button>`).join('');
$('#out').innerHTML=o.map((v,i)=>`<div class="led ${v?'h':''}"><i></i>${v}<br><span>${c.outs[i]}</span></div>`).join('');
$('#dec').textContent=`Input = ${S.sw.join('')}₂ = ${num(S.sw)}₁₀ · Output = ${o.join('')}₂ = ${num(o)}₁₀`}
function tbl(){const{c}=cur(),n=c.ins.length,N=2**n,P=16,pages=Math.ceil(N/P),act=num(S.sw);S.page=Math.min(S.page,pages-1);
$('#tinfo').textContent=`${N} rows · page ${S.page+1}/${pages}`;
$('#pager').innerHTML=`<button onclick="S.page=Math.max(0,S.page-1);tbl()">‹ Prev</button><button onclick="S.page=Math.min(${pages-1},S.page+1);tbl()">Next ›</button><button onclick="S.page=pg();tbl()">Go to active row</button>`;
let h=`<table><tr>${c.ins.map(x=>`<th>${x}</th>`).join('')}<th></th>${c.outs.map(x=>`<th>${x}</th>`).join('')}</tr>`;
for(let i=S.page*P;i<Math.min(N,S.page*P+P);i++){const a=bits(i,n);h+=`<tr class="${i==act?'a':''}">${a.map(x=>`<td>${x}</td>`).join('')}<td>→</td>${c.f(a).map(x=>`<td>${x}</td>`).join('')}</tr>`}
$('#tt').innerHTML=h+'</table>'}
function exportCsv(){const{c}=cur(),N=2**c.ins.length;if(N>4096&&!confirm(`This table has ${N} rows. Generate it?`))return;cp(csv(c))}
function code(){const{c}=cur();$('#v').textContent=verilog(c,S.mod);$('#t').textContent=tb(c,S.mod)}
/* ---------- sequential ---------- */
const SQ={D:{l:'D flip-flop',ins:['D'],nx:(q,i)=>i[0]},T:{l:'T flip-flop',ins:['T'],nx:(q,i)=>i[0]?1-q:q},JK:{l:'JK flip-flop',ins:['J','K'],nx:(q,[j,k])=>j&&k?1-q:j?1:k?0:q},SR:{l:'SR flip-flop',ins:['S','R'],nx:(q,[s,r])=>s&&r?null:s?1:r?0:q},
UP:{l:'Up counter',w:1,nx:(q,i,w)=>(q+1)%2**w},DN:{l:'Down counter',w:1,nx:(q,i,w)=>(q+2**w-1)%2**w},RING:{l:'Ring counter',w:1,nx:(q,i,w)=>((q<<1)|(q>>(w-1)))&(2**w-1)},JOHN:{l:'Johnson counter',w:1,nx:(q,i,w)=>((q<<1)|(1-(q>>(w-1))))&(2**w-1)}};
const VS={D:'always @(posedge clk or posedge rst)\n  if (rst) Q <= 1\'b0; else Q <= D;',T:'always @(posedge clk or posedge rst)\n  if (rst) Q <= 1\'b0; else if (T) Q <= ~Q;',JK:'always @(posedge clk or posedge rst)\n  if (rst) Q <= 1\'b0;\n  else case ({J,K})\n    2\'b01: Q <= 1\'b0;\n    2\'b10: Q <= 1\'b1;\n    2\'b11: Q <= ~Q;\n    default: Q <= Q;\n  endcase',SR:'always @(posedge clk or posedge rst)\n  if (rst) Q <= 1\'b0;\n  else case ({S,R})\n    2\'b01: Q <= 1\'b0;\n    2\'b10: Q <= 1\'b1;\n    2\'b11: Q <= 1\'bx; // invalid input\n    default: Q <= Q;\n  endcase'};
let Q={t:'D',w:3,i:[0],q:0,h:[],auto:null,bad:false};
const qinit=()=>Q.t=='RING'?1:0,isC=()=>!!SQ[Q.t].w,qw=()=>isC()?Q.w:1;
function qreset(){clearInterval(Q.auto);Q.auto=null;Q.i=(SQ[Q.t].ins||[]).map(()=>0);Q.q=qinit();Q.bad=false;Q.h=[{i:[...Q.i],q:Q.q}]}
function pulse(){const n=SQ[Q.t].nx(Q.q,Q.i,Q.w);Q.bad=n===null;Q.q=n===null?Q.q:n;Q.h.push({i:[...Q.i],q:Q.q});if(Q.h.length>24)Q.h.shift();seqView()}
qreset();
function renderSeq(){$('#view').innerHTML=`<div class="card"><div class="row"><select onchange="Q.t=this.value;qreset();renderSeq()">${Object.keys(SQ).map(k=>`<option value="${k}" ${k==Q.t?'selected':''}>${SQ[k].l}</option>`).join('')}</select>${isC()?`<label>Bits <select onchange="Q.w=+this.value;qreset();renderSeq()">${[2,3,4,5,6,7,8].map(v=>`<option ${v==Q.w?'selected':''}>${v}</option>`).join('')}</select></label>`:''}</div><p class="mu">Edge-triggered: state updates only on the rising clock edge. Reset is asynchronous.</p></div><div class="card"><div class="row" id="qin"></div><div class="row" style="margin-top:8px"><button onclick="pulse()">Clock pulse ↑</button><button id="au" onclick="auto()">Auto clock</button><button onclick="qreset();seqView()">Reset</button></div><div id="qst" style="margin-top:10px"></div></div><div class="card"><b>Timing waveform</b> <small>(from recorded clock edges)</small><div class="scroll" id="wf"></div></div><div class="card" id="qtt"></div><div class="card"><b>Verilog HDL</b> <small>Not compiled or simulated here.</small><pre id="qv"></pre><button onclick="cp($('#qv').textContent)">Copy</button><span id="msg" class="mu"></span></div>`;seqView()}
function auto(){if(Q.auto){clearInterval(Q.auto);Q.auto=null}else Q.auto=setInterval(()=>{if(S.tab!='seq'){clearInterval(Q.auto);Q.auto=null}else pulse()},700);const b=$('#au');b&&b.classList.toggle('on',!!Q.auto)}
function seqView(){if(S.tab!='seq')return;const D=SQ[Q.t],w=qw(),qb=bits(Q.q,w);
$('#qin').innerHTML=(D.ins||[]).map((n,i)=>`<button class="sw ${Q.i[i]?'on':''}" onclick="Q.i[${i}]^=1;seqView()"><b>${n}</b>${Q.i[i]}</button>`).join('')||'<span class="mu">No data inputs</span>';
const nx=D.nx(Q.q,Q.i,Q.w);$('#qst').innerHTML=`Current state Q = <b>${qb.join('')}</b> (${Q.q}) · Next state = <b>${nx===null?'invalid (S=R=1, state held)':bits(nx,w).join('')+' ('+nx+')'}</b>${Q.bad?' <span class="bad">⚠ SR invalid input at last edge</span>':''}`;
const sig=isC()?nm('Q',w).map((n,k)=>[n,Q.h.map(h=>bits(h.q,w)[k])]):[...(D.ins||[]).map((n,k)=>[n,Q.h.map(h=>h.i[k])]),['Q',Q.h.map(h=>h.q)]],cw=36,H=24,rows=[['CLK',null],...sig];
let s=`<svg width="${60+Q.h.length*cw}" height="${rows.length*34+8}" font-size="11" fill="currentColor">`;

const LC=[
{s:'Number system & De Morgan',t:'Number systems & De Morgan’s law',
h:()=>`<p class="mu">You will learn: how binary, octal and hex work, how to convert between them, and how De Morgan’s law flips AND into OR.</p>
<h3>Why digital?</h3><p>A digital system uses only two voltage levels: <b>LOW = 0</b> and <b>HIGH = 1</b>. Two levels are easy to build, easy to store and hard to confuse with noise. That is why every computer, phone and chip is made of 0s and 1s.</p>
<h3>Number systems</h3><p>A number system is defined by its <b>base</b> (how many digits it uses). Each digit position has a <b>weight</b>: the base raised to a power.</p>
<div class="scroll"><table><tr><th>System</th><th>Base</th><th>Digits</th><th>Example</th></tr><tr><td>Binary</td><td>2</td><td>0, 1</td><td>1011</td></tr><tr><td>Octal</td><td>8</td><td>0–7</td><td>13</td></tr><tr><td>Decimal</td><td>10</td><td>0–9</td><td>11</td></tr><tr><td>Hexadecimal</td><td>16</td><td>0–9, A–F</td><td>B</td></tr></table></div>
<p>The four examples are all the same number: 1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11₁₀.</p>
<h3>Conversions</h3><ul>
<li><b>Decimal → binary:</b> divide by 2 again and again, note the remainders, read them bottom to top. 13 ÷ 2 = 6 r<b>1</b>, 6 ÷ 2 = 3 r<b>0</b>, 3 ÷ 2 = 1 r<b>1</b>, 1 ÷ 2 = 0 r<b>1</b>, so 13 = <b>1101</b>₂.</li>
<li><b>Binary → octal:</b> group bits in 3s from the right. 101 110 = 56₈.</li>
<li><b>Binary → hex:</b> group bits in 4s. 1101 0110 = D6₁₆ (= 214₁₀).</li></ul>
<p><b>Try it</b>: type a number and pick its base.</p>
<div class="row"><input id="cvin" value="45" size="10" oninput="lcConv()"><select id="cvb" onchange="lcConv()"><option value="10">Decimal</option><option value="2">Binary</option><option value="8">Octal</option><option value="16">Hex</option></select></div><div class="scroll" id="cvout" style="margin-top:8px"></div>
<h3>Negative numbers: two’s complement</h3><p>Computers store signed numbers in two’s complement: <b>invert every bit, then add 1</b>. For −5 in 8 bits: 5 = 00000101, invert → 11111010, add 1 → <b>11111011</b>. The top bit is the sign (1 means negative). An n-bit number covers −2<sup>n−1</sup> to 2<sup>n−1</sup>−1, so 8 bits give −128 to 127.</p>
<h3>Boolean algebra basics</h3><p>Boolean variables are 0 or 1. We write OR as <b>+</b>, AND as <b>·</b> and NOT as a prime (A′).</p>
<div class="scroll"><table><tr><th>Law</th><th>OR form</th><th>AND form</th></tr><tr><td>Identity</td><td>A + 0 = A</td><td>A · 1 = A</td></tr><tr><td>Null</td><td>A + 1 = 1</td><td>A · 0 = 0</td></tr><tr><td>Idempotent</td><td>A + A = A</td><td>A · A = A</td></tr><tr><td>Complement</td><td>A + A′ = 1</td><td>A · A′ = 0</td></tr><tr><td>Absorption</td><td>A + A·B = A</td><td>A · (A + B) = A</td></tr><tr><td>Distributive</td><td>A + B·C = (A+B)(A+C)</td><td>A·(B+C) = A·B + A·C</td></tr></table></div>
<h3>De Morgan’s law</h3><p>Two rules for pushing a NOT through an AND or an OR:</p>
<div class="note"><span class="ov">A·B</span> = <span class="ov">A</span> + <span class="ov">B</span> &nbsp;(NOT of AND = OR of the NOTs)<br><span class="ov">A+B</span> = <span class="ov">A</span> · <span class="ov">B</span> &nbsp;(NOT of OR = AND of the NOTs)</div>
<p>Memory trick: <b>break the line, change the sign.</b> Example: (A + B·C)′ = A′ · (B·C)′ = A′ · (B′ + C′). It works for any number of variables: (A·B·C)′ = A′ + B′ + C′.</p>
<p>Why it matters: it shows that NAND is an OR gate with inverted inputs and NOR is an AND gate with inverted inputs. This is the key to universal gates in Lecture 2. The table checks both rules for every input:</p>
<div class="scroll"><table><tr><th>A</th><th>B</th><th>(A·B)′</th><th>A′+B′</th><th>(A+B)′</th><th>A′·B′</th><th>Equal?</th></tr>${[0,1,2,3].map(i=>{const a=i>>1,b=i&1,x=1-(a&b),y=(1-a)|(1-b),p=1-(a|b),q=(1-a)&(1-b);return`<tr><td>${a}</td><td>${b}</td><td>${x}</td><td>${y}</td><td>${p}</td><td>${q}</td><td class="${x==y&&p==q?'ok':'bad'}">${x==y&&p==q?'✓':'✗'}</td></tr>`}).join('')}</table></div>`,
i:()=>lcConv(),
q:[['Convert 45₁₀ to binary.','45 = 32 + 8 + 4 + 1, so 45 = <b>101101</b>₂.'],['Convert 10111100₂ to hex.','Group in 4s: 1011 1100 = <b>BC</b>₁₆.'],['Simplify (A·B′)′ using De Morgan’s law.','Break the line and change the sign: A′ + B″ = <b>A′ + B</b>.']]},
{s:'Logic gates',t:'Fundamental & universal logic gates',
h:()=>{const ks=['AND','OR','NAND','NOR','XOR','XNOR'];return`<p class="mu">You will learn: what each gate does, and why NAND and NOR can build every other gate.</p>
<h3>What is a logic gate?</h3><p>A gate is a tiny circuit with one or more binary inputs and one binary output. The output follows a fixed Boolean rule. Every digital chip is built from gates.</p>
<h3>Fundamental gates</h3><ul><li><b>AND (A·B)</b>: output is 1 only when <i>all</i> inputs are 1. Think of switches in series.</li><li><b>OR (A+B)</b>: output is 1 when <i>at least one</i> input is 1. Think of switches in parallel.</li><li><b>NOT (A′)</b>: the inverter. The output is the opposite of the input.</li></ul>
<p>Any logic function can be written with just these three.</p>
<h3>Derived gates</h3><ul><li><b>NAND</b>: AND followed by NOT. Output is 0 only when all inputs are 1.</li><li><b>NOR</b>: OR followed by NOT. Output is 1 only when all inputs are 0.</li><li><b>XOR (A⊕B)</b>: output is 1 when the inputs are <i>different</i> (an odd number of 1s). It gives the sum bit of an adder.</li><li><b>XNOR</b>: output is 1 when the inputs are the <i>same</i>. It works as an equality detector.</li></ul>
<h3>Truth tables (2 inputs)</h3><div class="scroll"><table><tr><th>A</th><th>B</th>${ks.map(k=>`<th>${k}</th>`).join('')}</tr>${[0,1,2,3].map(i=>{const a=i>>1,b=i&1;return`<tr><td>${a}</td><td>${b}</td>${ks.map(k=>{const[op,,ng]=gate[k],r=op(a,b);return`<td>${ng?1-r:r}</td>`}).join('')}</tr>`}).join('')}</table></div>
<div class="row" style="margin-top:8px"><button onclick="go('comb','NAND')">Try NAND in the simulator</button><button onclick="go('comb','XOR')">Try XOR in the simulator</button></div>
<h3>Universal gates</h3><p>A gate is <b>universal</b> if every other gate can be built from it alone. <b>NAND and NOR are universal.</b></p>
<div class="scroll"><table><tr><th>Gate</th><th>Using only NAND</th><th>NAND count</th></tr><tr><td>NOT</td><td>NAND(A, A) = A′</td><td>1</td></tr><tr><td>AND</td><td>NAND, then NAND as inverter</td><td>2</td></tr><tr><td>OR</td><td>NAND(A′, B′) = A + B</td><td>3</td></tr></table></div>
<p>The OR row is De Morgan’s law at work: A + B = (A′ · B′)′ = NAND(A′, B′). With NOR the roles swap: NOT = NOR(A, A), OR = NOR then an inverter, AND = NOR(A′, B′).</p>
<p><b>XOR from four NANDs:</b> n1 = NAND(A, B), n2 = NAND(A, n1), n3 = NAND(B, n1), Y = NAND(n2, n3).</p>
<div class="row"><button onclick="go('design','nxor')">Build it in the Circuit designer</button></div>
<div class="note">Why universal gates matter: a factory only needs to perfect one gate type. In CMOS, a 2-input NAND uses 4 transistors while AND needs 6, so NAND-based designs are smaller and faster.</div>`},
q:[['What does a NAND gate output for A = 1, B = 1?','AND gives 1, then the NOT flips it: <b>0</b>.'],['How do you make a NOT gate from a NOR gate?','Tie both inputs together: NOR(A, A) = (A + A)′ = <b>A′</b>.'],['What is the output of a 3-input XOR for inputs 1, 1, 1?','XOR is 1 for an odd number of 1s. Three is odd, so the output is <b>1</b>.']]},
{s:'Combinational & sequential',t:'Combinational & sequential circuits',
h:()=>`<p class="mu">You will learn: the difference between circuits without and with memory, and how the four flip-flops behave.</p>
<h3>Combinational circuits</h3><p>The output depends <b>only on the present inputs</b>. There is no memory and no clock. Change the inputs and the output follows after a small gate delay.</p>
<ul><li><b>Half adder:</b> Sum = A ⊕ B, Carry = A·B.</li><li><b>Full adder:</b> Sum = A ⊕ B ⊕ Cin, Cout = A·B + Cin·(A ⊕ B).</li><li><b>Multiplexer (MUX):</b> picks one of 2<sup>s</sup> inputs using s select lines.</li><li><b>Decoder:</b> n address bits turn on exactly one of 2<sup>n</sup> outputs. An encoder does the reverse.</li><li><b>Comparator:</b> reports A &gt; B, A = B or A &lt; B.</li></ul>
<p>Design steps: write the truth table → simplify with Boolean algebra or a K-map → draw the gates.</p>
<div class="row"><button onclick="go('comb','FA')">Full adder</button><button onclick="go('comb','MUX')">MUX</button><button onclick="go('comb','DEC')">Decoder</button></div>
<h3>Sequential circuits</h3><p>The output depends on the <b>present inputs and the past</b>. The circuit remembers a <b>state</b>, stored in flip-flops and updated by a clock.</p>
<div class="note">Inputs + present state → combinational logic → outputs + next state → (clock edge) → present state</div>
<p>We write the present state as <b>Q</b> and the next state as <b>Q⁺</b>.</p>
<h3>Latch vs flip-flop</h3><ul><li>A <b>latch</b> is level-sensitive: it changes while its enable input is active.</li><li>A <b>flip-flop</b> is edge-triggered: it samples its inputs only at the clock edge (rising ↑ in this app). This makes whole systems change in step.</li></ul>
<h3>The four flip-flops</h3><div class="scroll"><table><tr><th>Type</th><th>Behaviour</th><th>Q⁺</th></tr><tr><td>D</td><td>copies D</td><td>D</td></tr><tr><td>T</td><td>T=0 hold, T=1 toggle</td><td>T ⊕ Q</td></tr><tr><td>SR</td><td>00 hold, 01 reset, 10 set, 11 invalid</td><td>S + R′·Q</td></tr><tr><td>JK</td><td>00 hold, 01 reset, 10 set, 11 toggle</td><td>J·Q′ + K′·Q</td></tr></table></div>
<p>SR is invalid at S = R = 1 because it asks for set and reset at once. JK fixes this by toggling. Tie J = K = T to turn a JK into a T flip-flop. Connect J = D and K = D′ to make a D flip-flop.</p>
<p><b>Setup and hold time:</b> the data input must be stable a little <i>before</i> (setup) and <i>after</i> (hold) the clock edge, or the flip-flop can capture a wrong value.</p>
<div class="row"><button onclick="go('seq','JK')">JK in the Sequential tab</button><button onclick="go('design','dff')">D-FF in the designer</button><button onclick="go('design','srl')">NOR SR latch</button></div>`,
q:[['Which type of circuit has memory?','<b>Sequential</b> circuits. Combinational circuits depend only on the present inputs.'],['A JK flip-flop has Q = 0 and J = K = 1. What is Q after the clock edge?','JK = 11 toggles, so Q becomes <b>1</b>.'],['Why is S = R = 1 invalid for an SR flip-flop?','It requests set and reset together, so the result is undefined. In a NOR latch both outputs drop to 0 and the final state is unpredictable.']]},
{s:'Counters & registers',t:'Counters & registers',
h:()=>`<p class="mu">You will learn: how registers store and shift bits, and how ripple, synchronous, ring and Johnson counters work.</p>
<h3>Registers</h3><p>A <b>register</b> is a group of flip-flops sharing one clock that stores an n-bit word. A <b>shift register</b> also moves the stored bits one place on every clock edge.</p>
<ul><li><b>SISO</b>: serial in, serial out (a delay line)</li><li><b>SIPO</b>: serial in, parallel out (receive data)</li><li><b>PISO</b>: parallel in, serial out (send data)</li><li><b>PIPO</b>: parallel in, parallel out (plain storage)</li></ul>
<p>Example: a 4-bit shift register receiving 1, 0, 1, 1 (state Q3 Q2 Q1 Q0):</p>
<div class="scroll"><table><tr><th>Clock</th><th>Serial in</th><th>Q3 Q2 Q1 Q0</th></tr><tr><td>start</td><td>–</td><td>0000</td></tr><tr><td>1</td><td>1</td><td>1000</td></tr><tr><td>2</td><td>0</td><td>0100</td></tr><tr><td>3</td><td>1</td><td>1010</td></tr><tr><td>4</td><td>1</td><td>1101</td></tr></table></div>
<p>Shifting left multiplies by 2 and shifting right divides by 2. All flip-flops must update at the same instant, which the Circuit designer simulates.</p>
<h3>Counters</h3><p>A <b>counter</b> is a register that steps through a fixed sequence of states on each clock pulse.</p>
<div class="scroll"><table><tr><th></th><th>Asynchronous (ripple)</th><th>Synchronous</th></tr><tr><td>Clock</td><td>Each flip-flop clocks the next</td><td>All share one clock</td></tr><tr><td>Speed</td><td>Slower, delays add up</td><td>Faster</td></tr><tr><td>Logic</td><td>Very simple</td><td>Extra gates decide toggling</td></tr></table></div>
<ul><li>An n-bit binary counter has <b>2<sup>n</sup> states</b> (modulo-2<sup>n</sup>). Up counters count 000 → 001 → … → 111 → 000. Down counters count the other way.</li><li><b>MOD-N counter:</b> needs ⌈log₂N⌉ flip-flops and resets after N states. A decade (MOD-10) counter uses 4 flip-flops and clears when it reaches 1010.</li><li><b>Frequency division:</b> the output of stage n runs at f / 2<sup>n</sup>.</li></ul>
<h3>Ring and Johnson counters</h3><ul><li><b>Ring:</b> one 1 circulates: 1000 → 0100 → 0010 → 0001 → 1000. It has n states for n flip-flops.</li><li><b>Johnson (twisted ring):</b> the inverted last output feeds the first input. A 3-bit one runs 000 → 001 → 011 → 111 → 110 → 100 → 000. It has <b>2n</b> states.</li></ul>
<div class="row"><button onclick="go('seq','UP')">Up counter</button><button onclick="go('seq','RING')">Ring</button><button onclick="go('seq','JOHN')">Johnson</button><button onclick="go('design','rip')">Build a ripple counter</button></div>`,
q:[['How many states does a 4-bit binary counter have?','2⁴ = <b>16</b> states (0000 to 1111).'],['How many states does a 3-bit Johnson counter have?','2n = <b>6</b> states.'],['Which is faster, a ripple or a synchronous counter, and why?','<b>Synchronous.</b> All flip-flops share the clock, so delays do not accumulate stage by stage.']]},
{s:'VLSI verification & synthesis',t:'VLSI verification & synthesis',
h:()=>`<p class="mu">You will learn: how a chip goes from a Verilog description to gates, and how engineers check that it is correct.</p>
<h3>What is VLSI?</h3><p><b>Very Large Scale Integration</b> puts millions to billions of transistors on one chip. Nobody draws that by hand, so designers describe hardware in code (RTL) and let tools do the rest.</p>
<h3>The design flow</h3><ol><li><b>Specification</b>: what must the chip do?</li><li><b>RTL design</b>: describe registers and the logic between them in Verilog or VHDL.</li><li><b>Functional verification</b>: simulate the RTL against the spec.</li><li><b>Logic synthesis</b>: turn RTL into a gate-level netlist.</li><li><b>Place and route</b>: position the cells and draw the wires.</li><li><b>Timing and physical checks</b>: static timing analysis (STA), design-rule check (DRC), layout-vs-schematic (LVS).</li><li><b>Tape-out, fabrication and testing</b>.</li></ol>
<h3>RTL in one example</h3><pre>module counter4(input clk, rst, output reg [3:0] q);
  always @(posedge clk or posedge rst)
    if (rst) q &lt;= 4'b0;
    else     q &lt;= q + 1;
endmodule</pre>
<p>Rules of thumb: use <b>non-blocking</b> assignment (<code>&lt;=</code>) in clocked blocks, <b>blocking</b> (<code>=</code>) in combinational blocks, and cover every branch of an <code>if</code> or <code>case</code> in combinational logic. A missing branch creates an unwanted <b>latch</b>.</p>
<h3>Verification</h3><p>Verification asks: <b>does the design do what the spec says?</b> It happens before the chip is made, because a bug found after fabrication costs millions.</p>
<ul><li><b>Testbench</b>: code that wraps the design under test (DUT). It has a stimulus generator, a monitor and a checker (scoreboard) that compares the DUT with a reference model.</li><li><b>Directed tests</b> hit known corner cases. <b>Constrained-random tests</b> explore many legal inputs automatically.</li><li><b>Coverage</b> measures how much was exercised: code coverage (lines, branches) and functional coverage (spec features).</li><li><b>Assertions</b> (SVA) state rules such as “request is always followed by grant within 4 cycles”.</li><li><b>Formal verification</b> proves properties mathematically instead of simulating, and <b>equivalence checking</b> compares two versions of a design.</li><li><b>UVM</b> is the standard SystemVerilog methodology for building reusable testbenches.</li></ul>
<p>Small circuits can be tested exhaustively, which is what the testbenches in this app do. A 64-bit adder has 2<sup>128</sup> input pairs, so real projects rely on random stimulus, coverage and formal methods.</p>
<div class="note">Verification checks the design before fabrication. Manufacturing test checks each physical chip for defects afterwards.</div>
<h3>Synthesis</h3><p>Synthesis turns RTL into a <b>gate-level netlist</b> built from a foundry’s <b>standard-cell library</b> (NAND, NOR, flip-flops and so on).</p>
<ol><li><b>Translate</b> the RTL into generic logic and registers.</li><li><b>Optimise</b> the logic with Boolean simplification, the same idea as K-maps.</li><li><b>Technology-map</b> onto real cells, guided by constraints: clock period, area and power.</li><li><b>Check</b>: run equivalence checking (RTL vs netlist) and STA.</li></ol>
<p>The trade-off is <b>PPA</b>: power, performance (timing) and area. Faster usually means bigger and hungrier. Only synthesizable Verilog works here: <code>assign</code>, <code>always @(posedge clk)</code> and <code>if/case</code> are fine, while <code>#delay</code>, <code>initial</code> and <code>$display</code> belong in testbenches.</p>
<p>Common tools: Icarus Verilog and Verilator (simulation), Yosys (open-source synthesis), Vivado and Quartus (FPGA), and commercial suites from Synopsys and Cadence.</p>
<div class="note">The Verilog and testbench in this app’s Combinational and Sequential tabs have not been compiled here. Run them in a simulator such as Icarus Verilog before relying on them.</div>
<div class="row"><button onclick="go('comb','FA')">See a generated module + testbench</button><button onclick="go('seq','UP')">Counter Verilog</button></div>`,
q:[['What does logic synthesis produce?','A <b>gate-level netlist</b> mapped to the standard cells of a chosen technology.'],['Why can’t we test a 64-bit adder exhaustively?','Two 64-bit inputs give 2¹²⁸ combinations. Engineers use constrained-random tests, coverage and formal proofs instead.'],['When do you use <code>&lt;=</code> instead of <code>=</code> in Verilog?','Use <b>non-blocking <code>&lt;=</code></b> for registers in clocked <code>always @(posedge clk)</code> blocks. Use <code>=</code> in combinational blocks.']]}];
function renderLearn(){const L=LC[LI];$('#view').innerHTML=`<div class="card"><b>📚 Learning center</b> <small>Short lecture notes in plain language.</small><div class="chips" style="margin-top:8px">${LC.map((l,i)=>`<button class="${i==LI?'act':''}" onclick="LI=${i};renderLearn();window.scrollTo(0,0)">${i+1}. ${l.s}</button>`).join('')}</div></div>
<div class="card lec"><div class="mu">Lecture ${LI+1} of ${LC.length}</div><h2 style="margin:2px 0 8px;font-size:18px">${L.t}</h2>${L.h()}<h3>Quick check</h3>${L.q.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}<div class="row sp" style="margin-top:12px"><button ${LI?'':'disabled'} onclick="LI--;renderLearn();window.scrollTo(0,0)">‹ Previous</button><button ${LI<LC.length-1?'':'disabled'} onclick="LI++;renderLearn();window.scrollTo(0,0)">Next ›</button></div></div>`;if(L.i)L.i()}

main();
</script></body></html>
